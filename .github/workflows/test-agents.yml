name: Test Agents
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pytest httpx websockets psutil
      # Syntax-check every Python source. The previous step used
      # PowerShell (Get-ChildItem | ForEach-Object) which does not exist
      # on the Ubuntu runner's bash — it failed with exit 127 on every
      # push. python -m compileall is the portable equivalent.
      - name: Syntax-check all Python sources
        run: python -m compileall -q .
