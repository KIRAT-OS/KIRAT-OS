name: Test Agents
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pytest httpx websockets psutil
      - run: Get-ChildItem -Recurse -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }
